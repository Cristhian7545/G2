<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>
  <link rel="stylesheet" href="/css/header.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/login.css">

</head>
<body>
<!-- ✅ Header importado correctamente -->
<div th:replace="fragments/header :: navbar"></div>

<div class="container login-container">
  <div class="row g-0">
    <!-- Columna de imagen -->
    <div class="col-lg-6 d-none d-lg-block login-image">
    </div>

    <!-- Columna de formulario -->
    <div class="col-lg-6 login-form">
      <div class="text-center mb-5">
        <i class="bi bi-shield-lock-fill logo"></i>
        <h1 class="h3 fw-bold">Iniciar Sesión</h1>
        <p class="text-muted">Ingresa tus credenciales para continuar</p>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-4">
          <label for="username" class="form-label fw-medium">Correo electrónico o Usuario</label>
          <div class="input-group">
    <span class="input-group-text">
      <i class="bi bi-envelope-fill"></i>
    </span>
            <input type="text" class="form-control" id="username" name="username" placeholder="correo@ejemplo.com" required>
          </div>
        </div>


        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label for="password" class="form-label fw-medium">Contraseña</label>
            <a href="#" class="text-decoration-none small" style="color: var(--primary-color);">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••">
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Recordar sesión</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 btn-login">
          Iniciar Sesión
        </button>



        <div class="additional-links">
          <p>¿No tienes cuenta? <a th:href="@{/register}">Regístrate</a>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer insertado -->
<div th:replace="fragments/footer :: footer"></div>

<!-- JS al final del body (recomendado) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
