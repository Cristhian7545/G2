<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
  <h1>Regístrate</h1>
  <form th:action="@{/register}" th:object="${registroForm}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div>
      <label>Nombre</label>
      <input type="text" th:field="*{nombre}" />
      <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
    </div>
    <div>
      <label>Apellido Paterno</label>
      <input type="text" th:field="*{apellidoPaterno}" />
      <p th:if="${#fields.hasErrors('apellidoPaterno')}" th:errors="*{apellidoPaterno}"></p>
    </div>
    <div>
      <label>Apellido Materno</label>
      <input type="text" th:field="*{apellidoMaterno}" />
      <p th:if="${#fields.hasErrors('apellidoMaterno')}" th:errors="*{apellidoMaterno}"></p>
    </div>
    <div>
      <label>DNI</label>
      <input type="text" th:field="*{dni}" />
      <p th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></p>
    </div>
    <div>
      <label>Sexo</label>
      <input type="text" th:field="*{sexo}" />
      <p th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}"></p>
    </div>
    <div>
      <label>Correo electrónico</label>
      <input type="email" th:field="*{email}" />
      <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>
    <div>
      <label>Contraseña</label>
      <input type="password" th:field="*{password}" />
      <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>

    <button type="submit">Registrarme</button>
  </form>
  <p>¿Ya tienes cuenta? <a th:href="@{/login}">Ingresa aquí</a></p>
</body>
</html>
