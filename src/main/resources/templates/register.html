<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
</head>
<body>
<h2>Registro de paciente</h2>

<form th:action="@{/register}" th:object="${registroForm}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

  <label>Usuario:</label><br>
  <input type="text" th:field="*{username}" required/><br><br>

  <label>Email:</label><br>
  <input type="email" th:field="*{email}" required/><br><br>

  <label>Contraseña:</label><br>
  <input type="password" th:field="*{password}" required/><br><br>

  <label>Nombres:</label><br>
  <input type="text" th:field="*{nombres}" required/><br><br>

  <label>Apellidos:</label><br>
  <input type="text" th:field="*{apellidos}" required/><br><br>

  <label>Teléfono:</label><br>
  <input type="text" th:field="*{telefono}" /><br><br>

  <label>Dirección:</label><br>
  <input type="text" th:field="*{direccion}" /><br><br>

  <button type="submit">Registrarme</button>
</form>

<p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</body>
</html>
